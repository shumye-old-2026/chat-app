<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የኔ ቻት አፕ</title>
    <style>
       /* 1. ዲዛይን (CSS) - የተስተካከለ */
        #input-area { 
            display: flex; 
            padding: 10px; 
            background: #f0f2f5; 
            align-items: center; 
            box-sizing: border-box; /* ይሄንን ጨምር */
        }
        input { 
            flex: 1; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 20px; 
            outline: none; 
            margin-right: 5px; 
            min-width: 0; /* ይሄንን ጨምር */
        }
        button { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 1rem; 
            flex-shrink: 0; /* ይሄንን ጨምር */
        } 
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="messages">
            <div class="message received">ሰላም!እንዴት ነህ?</div>
            <div class="message sent">ሰላም! እኔ ደህና ነኝ። ያንተስ?</div>
        </div>
        <div id="input-area">
            <button id="emoji-btn">😊</button>
            <input type="text" id="messageInput" placeholder="መልዕክት ይጻፉ...">
            <input type="text" id="userInput" placeholder="ስምህ (Guest)" style="width: 80px; margin-left: 5px;">
            <button id="sendBtn">ላክ</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const emojiBtn = document.getElementById('emoji-btn');

        // መልዕክት ለመላክ
        function sendMessage() {
            const text = messageInput.value;
            const user = userInput.value || 'Guest';

            if (text.trim() !== "") {
                // መልዕክቱን በዌብሳይቱ ላይ አሳይ
                const messageHtml = <div class="message sent"><b>${user}:</b> ${text}</div>;
                messagesDiv.innerHTML += messageHtml;
                messageInput.value = ""; // የመጻፊያውን ቦታ አጽዳ
                messagesDiv.scrollTop = messagesDiv.scrollHeight; // ወደ ታች ውረድ
            }
        }

        // 'ላክ' ቁልፍ ሲጫን
        sendBtn.addEventListener('click', sendMessage);

        // 'Enter' ቁልፍ ሲጫን መልዕክት ላክ
        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // ኢሞጂ ለመጨመር
        emojiBtn.addEventListener('click', () => {
            messageInput.value += "😊";
            messageInput.focus();
        });
    </script>
</body>
</html>
