 <!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shumye Delivery</title>
    <style>
    /* አጠቃላይ ገጽታ */
    body { 
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        background-color: #f0f2f5; 
        display: flex; 
        justify-content: center; 
        padding: 15px; 
        margin: 0;
        color: #333;
    }

    /* ዋናው ሳጥን - ስክሪኑ እንዳይጠበብ የተስተካከለ */
    .container { 
        background: white; 
        padding: 25px; 
        border-radius: 20px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        width: 100%; 
        max-width: 480px; /* ለትላልቅ ስልኮችም እንዲመች */
        box-sizing: border-box;
    }

    /* የላይኛው ርዕስ */
    .header { 
        background: linear-gradient(135deg, #007bff, #0056b3); 
        color: white; 
        padding: 25px; 
        text-align: center; 
        border-radius: 15px; 
        font-weight: bold; 
        font-size: 24px;
        margin-bottom: 25px;
        box-shadow: 0 4px 12px rgba(0,123,255,0.2);
    }

    /* መረጃ መሙያ ሳጥኖች */
    input, textarea { 
        width: 100%; 
        padding: 15px; 
        margin-bottom: 15px; 
        border: 2px solid #eee; 
        border-radius: 12px; 
        box-sizing: border-box; 
        font-size: 16px;
        transition: border-color 0.3s;
        outline: none;
    }

    input:focus, textarea:focus {
        border-color: #007bff;
    }

    textarea {
        height: 100px;
        resize: none;
    }

    /* መላኪያ ቁልፍ */
    button { 
        width: 100%; 
        padding: 18px; 
        background: #28a745; 
        color: white; 
        border: none; 
        border-radius: 12px; 
        font-weight: bold; 
        font-size: 18px;
        cursor: pointer; 
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(40,167,69,0.2);
    }

    button:hover { 
        background: #218838; 
        transform: translateY(-1px);
    }

    button:active {
        transform: translateY(1px);
    }

    /* የትዕዛዞች ዝርዝር */
    .orders-list { 
        margin-top: 30px; 
        border-top: 2px solid #f8f9fa; 
        padding-top: 20px; 
    }

    .order-card { 
        background: #ffffff; 
        padding: 18px; 
        border-left: 6px solid #007bff; 
        margin-bottom: 15px; 
        border-radius: 12px; 
        box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        position: relative;
    }

    .order-card strong { 
        color: #222; 
        font-size: 18px; 
        display: block;
        margin-bottom: 5px;
    }

    .order-card p {
        margin: 5px 0;
        font-size: 15px;
        color: #555;
    }

    .order-card .status-tag { 
        display: inline-block;
        margin-top: 8px;
        padding: 4px 10px;
        background: #e7f3ff;
        color: #007bff;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
    }

    .order-card .order-time {
        float: right;
        font-size: 12px;
        color: #bbb;
    }
</style>
    
    
</head>
<body>
    <div class="container">
        <div class="header">Shumye Delivery 🚚</div>
        <input type="text" id="custName" placeholder="የእርስዎ ስም">
        <input type="text" id="custPhone" placeholder="ስልክ ቁጥር">
        <textarea id="item" placeholder="የሚፈልጉት ዕቃ እና መድረሻ ቦታ..."></textarea>
        <button id="sendBtn">ትዕዛዝ ላክ 🚀</button>

        <div class="orders-list" id="list">
            <p style="text-align:center; color:#999;">ትዕዛዞች እዚህ ይዘረዘራሉ...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ያንተ Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBVwvrXBlyaIISyUFf2NyLFBq_mmcvaPCc",
            authDomain: "my-chat-app-393d0.firebaseapp.com",
            databaseURL: "https://my-chat-app-393d0-default-rtdb.firebaseio.com",
            projectId: "my-chat-app-393d0",
            storageBucket: "my-chat-app-393d0.appspot.com",
            messagingSenderId: "836061447359",
            appId: "1:836061447359:web:9a071fb5931ad8b50e320a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ordersRef = ref(db, "orders");

        // ትዕዛዝ ለመላክ
        document.getElementById("sendBtn").onclick = function() {
            const name = document.getElementById("custName").value;
            const phone = document.getElementById("custPhone").value;
            const item = document.getElementById("item").value;

            if(name && phone && item) {
                push(ordersRef, {
                    name: name,
                    phone: phone,
                    item: item,
                    status: "በሂደት ላይ",
                    time: new Date().toLocaleTimeString()
                }).then(() => {
                    alert("ትዕዛዝዎ በተሳካ ሁኔታ ተልኳል! ✅");
                    document.getElementById("custName").value = "";
                    document.getElementById("custPhone").value = "";
                    document.getElementById("item").value = "";
                });
            } else {
                alert("እባክዎ ሁሉንም መረጃ ይሙሉ!");
            }
        };

        // ትዕዛዞችን ከዳታቤዝ ለማንበብ
        const list = document.getElementById("list");
        onValue(ordersRef, (snapshot) => {
            list.innerHTML = "";
            const data = snapshot.val();
            if(data) {
                Object.values(data).reverse().forEach(o => {
                    list.innerHTML += `
 <div class="order-card">
                            <strong>${o.name}</strong> (${o.phone})<br>
                            ${o.item} <br>
                            <small style="color:blue;">${o.status} - ${o.time}</small>
                        </div>`;
                });
            } else {
                list.innerHTML = "<p style='text-align:center; color:#999;'>ምንም ትዕዛዝ የለም</p>";
            }
        });
    </script>
</body>
</html>
