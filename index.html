[5/8/2026 6:58 PM] Shumyetadesse Asefa: <!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shumye Delivery</title>
    <style>
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background-color: #f0f2f5; 
        display: flex; 
        justify-content: center; 
        padding: 10px; 
        margin: 0;
    }
    .container { 
        background: white; 
        padding: 20px; 
        border-radius: 15px; 
        box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
        width: 100%; 
        max-width: 450px; /* ስክሪኑ እንዳይጠበብ ይረዳዋል */
        box-sizing: border-box;
    }
    .header { 
        background: linear-gradient(135deg, #4a90e2, #357abd); 
        color: white; 
        padding: 20px; 
        text-align: center; 
        border-radius: 10px; 
        font-weight: bold; 
        font-size: 22px;
        margin-bottom: 20px; 
    }
    input, textarea { 
        width: 100%; 
        padding: 14px; 
        margin-bottom: 12px; 
        border: 1px solid #ddd; 
        border-radius: 10px; 
        box-sizing: border-box; 
        font-size: 16px;
    }
    button { 
        width: 100%; 
        padding: 16px; 
        background: #28a745; 
        color: white; 
        border: none; 
        border-radius: 10px; 
        font-weight: bold; 
        font-size: 18px;
        cursor: pointer; 
        transition: 0.3s;
    }
    button:hover { 
        background: #218838; 
    }
    .orders-list { 
        margin-top: 25px; 
        border-top: 2px solid #f0f0f0; 
        padding-top: 15px; 
    }
    .order-card { 
        background: #ffffff; 
        padding: 15px; 
        border-left: 5px solid #4a90e2; 
        margin-bottom: 10px; 
        border-radius: 8px; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .order-card strong { color: #333; font-size: 17px; }
    .order-card small { color: #666; display: block; margin-top: 5px; }
</style>
    
    
</head>
<body>
    <div class="container">
        <div class="header">Shumye Delivery 🚚</div>
        <input type="text" id="custName" placeholder="የእርስዎ ስም">
        <input type="text" id="custPhone" placeholder="ስልክ ቁጥር">
        <textarea id="item" placeholder="የሚፈልጉት ዕቃ እና መድረሻ ቦታ..."></textarea>
        <button id="sendBtn">ትዕዛዝ ላክ 🚀</button>

        <div class="orders-list" id="list">
            <p style="text-align:center; color:#999;">ትዕዛዞች እዚህ ይዘረዘራሉ...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ያንተ Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBVwvrXBlyaIISyUFf2NyLFBq_mmcvaPCc",
            authDomain: "my-chat-app-393d0.firebaseapp.com",
            databaseURL: "https://my-chat-app-393d0-default-rtdb.firebaseio.com",
            projectId: "my-chat-app-393d0",
            storageBucket: "my-chat-app-393d0.appspot.com",
            messagingSenderId: "836061447359",
            appId: "1:836061447359:web:9a071fb5931ad8b50e320a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ordersRef = ref(db, "orders");

        // ትዕዛዝ ለመላክ
        document.getElementById("sendBtn").onclick = function() {
            const name = document.getElementById("custName").value;
            const phone = document.getElementById("custPhone").value;
            const item = document.getElementById("item").value;

            if(name && phone && item) {
                push(ordersRef, {
                    name: name,
                    phone: phone,
                    item: item,
                    status: "በሂደት ላይ",
                    time: new Date().toLocaleTimeString()
                }).then(() => {
                    alert("ትዕዛዝዎ በተሳካ ሁኔታ ተልኳል! ✅");
                    document.getElementById("custName").value = "";
                    document.getElementById("custPhone").value = "";
                    document.getElementById("item").value = "";
                });
            } else {
                alert("እባክዎ ሁሉንም መረጃ ይሙሉ!");
            }
        };

        // ትዕዛዞችን ከዳታቤዝ ለማንበብ
        const list = document.getElementById("list");
        onValue(ordersRef, (snapshot) => {
            list.innerHTML = "";
            const data = snapshot.val();
            if(data) {
                Object.values(data).reverse().forEach(o => {
                    list.innerHTML += `
 <div class="order-card">
                            <strong>${o.name}</strong> (${o.phone})<br>
                            ${o.item} <br>
                            <small style="color:blue;">${o.status} - ${o.time}</small>
                        </div>`;
                });
            } else {
                list.innerHTML = "<p style='text-align:center; color:#999;'>ምንም ትዕዛዝ የለም</p>";
            }
        });
    </script>
</body>
</html>
