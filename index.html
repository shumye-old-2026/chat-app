<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shumye Delivery</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 10px; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; box-sizing: border-box; }
        .header { background: #007bff; color: white; padding: 20px; text-align: center; border-radius: 10px; font-weight: bold; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 15px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .orders-list { margin-top: 25px; border-top: 2px solid #eee; padding-top: 15px; }
        .order-card { background: #fff; padding: 15px; border-left: 5px solid #007bff; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left; }
        .order-card strong { display: block; font-size: 17px; margin-bottom: 5px; color: #333; }
        .order-card p { margin: 5px 0; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Shumye Delivery 🚚</div>
        <input type="text" id="custName" placeholder="የእርስዎ ስም">
        <input type="text" id="custPhone" placeholder="ስልክ ቁጥር">
        <textarea id="item" placeholder="የሚፈልጉት ዕቃ እና መድረሻ ቦታ..."></textarea>
        <button id="sendBtn">ትዕዛዝ ላክ 🚀</button>

        <div class="orders-list" id="list">
            <p style="text-align:center; color:#999;">ትዕዛዞች እዚህ ይዘረዘራሉ...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVwvrXBlyaIISyUFf2NyLFBq_mmcvaPCc",
            authDomain: "my-chat-app-393d0.firebaseapp.com",
            databaseURL: "https://my-chat-app-393d0-default-rtdb.firebaseio.com",
            projectId: "my-chat-app-393d0",
            storageBucket: "my-chat-app-393d0.appspot.com",
            messagingSenderId: "836061447359",
            appId: "1:836061447359:web:9a071fb5931ad8b50e320a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ordersRef = ref(db, "orders");

        // ትዕዛዝ መላክ
        document.getElementById("sendBtn").onclick = function() {
            const name = document.getElementById("custName").value;
            const phone = document.getElementById("custPhone").value;
            const item = document.getElementById("item").value;

            if(name && phone && item) {
                push(ordersRef, {
                    name: name,
                    phone: phone,
                    item: item,
                    time: new Date().toLocaleTimeString()
                }).then(() => {
                    alert("ትዕዛዝዎ ተልኳል! ✅");
                    document.getElementById("custName").value = "";
                    document.getElementById("custPhone").value = "";
                    document.getElementById("item").value = "";
                });
            } else {
                alert("እባክዎ ሁሉንም መረጃ ይሙሉ!");
            }
        };

        // ትዕዛዞችን ከስር መዘርዘር (ዋናው ክፍል)
        const listDiv = document.getElementById("list");
        onValue(ordersRef, (snapshot) => {listDiv.innerHTML = ""; // የድሮውን አጽዳ
            const data = snapshot.val();
            if(data) {
                // መረጃውን ወደ Array ቀይረን ተገልብጦ (አዲሱ ላይ እንዲሆን) እናሳያለን
                Object.values(data).reverse().forEach(order => {
                    listDiv.innerHTML += 
                        <div class="order-card">
                            <strong>👤 ስም፡ ${order.name}</strong>
                            <p>📞 ስልክ፡ ${order.phone}</p>
                            <p>📦 ዕቃ፡ ${order.item}</p>
                            <p style="font-size:12px; color:#999;">⏰ ሰዓት፡ ${order.time}</p>
                        </div>;
                });
            } else {
                listDiv.innerHTML = "<p style='text-align:center; color:#999;'>ምንም ትዕዛዝ የለም</p>";
            }
        });
    </script>
</body>
</html>
