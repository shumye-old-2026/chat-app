<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የቻት መተግበሪያ</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: white;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #e5ddd5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            font-size: 15px;
        }

        .sent {
            align-self: flex-end;
            background-color: #dcf8c6;
            border-bottom-right-radius: 2px;
        }

        .received {
            align-self: flex-start;
            background-color: white;
            border-bottom-left-radius: 2px;
        }

        #input-area {
            display: flex;
            padding: 15px;
            background: #f0f0f0;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
        }

        button {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="messages">
        <div class="message received">ሰላም! እንዴት ነህ?</div>
    </div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="መልእክት ይጻፉ...">
        <button id="sendBtn">ላክ</button>
    </div>
</div>

<script>
    /* ስህተቶቹን ለማጥፋት ስሞቹን (Variables) አንድ ጊዜ ብቻ እንገልጻለን */
    const chatBox = document.getElementById('messages');
    const chatInput = document.getElementById('userInput');
    const chatBtn = document.getElementById('sendBtn');

    function sendMsg() {
        const text = chatInput.value.trim();
        if (text !== "") {
            const div = document.createElement('div');
            div.classList.add('message', 'sent');
            div.textContent = text;
            chatBox.appendChild(div);
            chatInput.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    chatBtn.addEventListener('click', sendMsg);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMsg();
    });
</script>

</body>
</html>
