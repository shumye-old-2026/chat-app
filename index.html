<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የዕቃ ማዘዣ እና ካርታ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
        header { text-align: center; padding: 15px; background: #007bff; color: white; border-radius: 8px; margin-bottom: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
        #map { height: 350px; width: 100%; margin: 20px 0; border-radius: 8px; border: 2px solid #ddd; background-color: #e5e5e5; }
        .order-section { margin-top: 30px; }
        .order-card { background: #fff; border-left: 5px solid #007bff; padding: 15px; margin-bottom: 10px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>የደንበኞች ማዘዣ ማዕከል</h2>
        </header>

        <div class="form-group">
            <label for="custName">የደንበኛ ስም</label>
            <input type="text" id="custName" placeholder="ስም ያስገቡ">
        </div>
        <div class="form-group">
            <label for="phone">ስልክ ቁጥር</label>
            <input type="tel" id="phone" placeholder="09...">
        </div>
        <div class="form-group">
            <label for="item">የዕቃው ዓይነት</label>
            <input type="text" id="item" placeholder="የዕቃው ስም">
        </div>
        <div class="form-group">
            <label for="price">ዋጋ (በብር)</label>
            <input type="number" id="price" placeholder="ዋጋ">
        </div>

        <label>የማድረሻ ቦታ (ካርታው ላይ ምልክቱን ያንቀሳቅሱ)</label>
        <div id="map"></div>

        <button id="sendBtn">ትዕዛዝ ላክ ✅</button>

        <div class="order-section">
            <h3>የተላኩ ትዕዛዞች ዝርዝር</h3>
            <div id="orderContainer"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module" src="script.js?v=3.0"></script>

</body>
</html>
