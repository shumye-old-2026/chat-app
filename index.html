<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የኔ ቻት አፕ</title>
    <style>
        /* 1. ዲዛይን (CSS) */
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #chat-container { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; overflow: hidden; display: flex; flex-direction: column; }
        #messages { height: 400px; padding: 16px; overflow-y: scroll; display: flex; flex-direction: column; border-bottom: 1px solid #ddd; }
        .message { padding: 8px 12px; margin: 5px; border-radius: 15px; max-width: 75%; word-wrap: break-word; position: relative; }
        .sent { align-self: flex-end; background-color: #dcf8c6; }
        .received { align-self: flex-start; background-color: #e4e6eb; }
        
        /* የሰዓት ዲዛይን */
        .time { font-size: 0.65rem; color: #777; margin-top: 4px; text-align: right; display: block; }

        #input-area { display: flex; padding: 10px; background: #f0f2f5; align-items: center; box-sizing: border-box; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; margin-right: 5px; min-width: 0; }
        #userInput { width: 60px; max-width: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; margin-right: 5px; text-align: center; }
        
        /* የላክ ቁልፍ እንዳይቆረጥ */
        #sendBtn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            flex-shrink: 0;
            font-weight: bold;
        }
        #sendBtn:hover { background-color: #0056b3; }
        #emoji-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; margin-right: 5px; padding: 0; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="messages">
            </div>
        <div id="input-area">
            <button id="emoji-btn">😊</button>
            <input type="text" id="messageInput" placeholder="መልዕክት ይጻፉ...">
            <input type="text" id="userInput" placeholder="Guest">
            <button id="sendBtn">ላክ</button>
        </div>
    </div>

    <script>
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn'); // ቁልፉን እዚህ ጋር ይይዛል

    // ሰዓቱን በትክክል የሚያወጣ ተግባር
    function getCurrentTime() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12; 
        return hours + ":" + minutes + " " + ampm;
    }

    // መልዕክት የሚልከው ተግባር
    function sendMessage() {
        const text = messageInput.value.trim();
        const user = userInput.value.trim() || 'Guest';
        const time = getCurrentTime();

        if (text !== "") {
            const messageHtml = 
                <div class="message sent">
                    <b>${user}:</b> ${text}
                    <div style="font-size: 0.7rem; color: #888; text-align: right;">${time}</div>
                </div>
            ;
            messagesDiv.innerHTML += messageHtml;
            messageInput.value = ""; 
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    }

    // ቁልፉ ሲጫን እንዲሰራ ማድረግ (ይህ በጣም አስፈላጊ ነው)
    sendBtn.addEventListener('click', sendMessage);

    // በ 'Enter' ቁልፍ እንዲሰራም መጨመር
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
