<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shumye Delivery</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; }
        header { background-color: #1a73e8; color: white; padding: 15px; text-align: center; border-radius: 10px; margin-bottom: 10px; }
        .form-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #map { 
            height: 380px !important; 
            width: 100%; 
            border-radius: 10px; 
            border: 2px solid #1a73e8; 
            background-color: #e5e5e5; 
            margin-bottom: 15px;
            display: block !important;
        }
        .order-card { background: white; padding: 15px; margin-top: 10px; border-radius: 10px; border-left: 5px solid #1a73e8; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">Shumye Delivery 🚀</h1>
</header>

<div class="form-container">
    <input type="text" id="custName" placeholder="የደንበኛ ስም">
    <input type="text" id="phone" placeholder="ስልክ ቁጥር">
    <input type="text" id="item" placeholder="የሚፈለገው ዕቃ...">
    <input type="number" id="price" placeholder="ዋጋ (በብር)">
    <button id="sendBtn">ትዕዛዝ ላክ 🚀</button>
</div>

<div id="map"></div>

<script>
    var map = L.map('map').setView([9.0192, 38.7525], 13);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var marker = L.marker([9.0192, 38.7525], {draggable: true}).addTo(map);

    // ካርታው ራሱን እንዲያድስ ማገዣ
    setTimeout(function() { 
        map.invalidateSize(); 
    }, 400);
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="script.js?v=final"></script>

</body>
</html>
