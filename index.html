<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Chat App</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #chat-container { background: white; width: 350px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 450px; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; background: #e5ddd5; }
        .msg { background: white; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; max-width: 80%; align-self: flex-start; font-size: 14px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .time { font-size: 10px; color: #888; display: block; text-align: right; margin-top: 4px; }
        #input-area { padding: 10px; background: #f0f0f0; display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: #0084ff; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="msgInput" placeholder="መልክት ይጻፉ...">
            <button onclick="send()">ላክ</button>
        </div>
    </div>
    <script>
        function send() {
            const input = document.getElementById('msgInput');
            const messages = document.getElementById('messages');
            if (input.value.trim() !== "") {
                const now = new Date();
                const time = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
                messages.innerHTML += <div class="msg sent">${input.value}<span class="time">${time}</span></div>;
                input.value = "";
                messages.scrollTop = messages.scrollHeight;
            }
        }
    </script>
</body>
</html>
