<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shumye Delivery</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            padding: 10px; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 100%; /* ስክሪኑን እንዲሞላ */
            max-width: 450px; 
            box-sizing: border-box; 
        }
        .header { 
            background-color: #4a90e2; 
            color: white; 
            padding: 20px; 
            text-align: center; 
            border-radius: 10px; 
            font-weight: bold; 
            margin-bottom: 20px; 
        }
        input, textarea { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background-color: #5cb85c; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .orders-list { margin-top: 25px; }
        .order-card { 
            background: #fafafa; 
            padding: 15px; 
            border: 1px solid #eee; 
            border-radius: 8px; 
            margin-bottom: 10px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Shumye Delivery 🚚</div>
        <input type="text" id="custName" placeholder="የእርስዎ ስም">
        <input type="text" id="custPhone" placeholder="ስልክ ቁጥር">
        <textarea id="item" placeholder="የሚፈልጉት ዕቃ እና መድረሻ ቦታ..."></textarea>
        <button id="sendBtn">ትዕዛዝ ላክ 🚀</button>

        <div class="orders-list" id="list">
            <p style="text-align:center; color:#999;">ትዕዛዞች እዚህ ይዘረዘራሉ...</p>
        </div>
    </div>

    </body>
</html>
