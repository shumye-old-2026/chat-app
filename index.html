 <!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የኔ ቻት አፕ</title>
    <style>
        /* 1. ዲዛይን (CSS) */
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #chat-container { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; overflow: hidden; display: flex; flex-direction: column; }
        #messages { height: 400px; padding: 16px; overflow-y: scroll; display: flex; flex-direction: column; border-bottom: 1px solid #ddd; }
        .message { padding: 8px 12px; margin: 5px; border-radius: 15px; max-width: 75%; word-wrap: break-word; }
        .sent { align-self: flex-end; background-color: #dcf8c6; } /* የተላከው በቀኝ በኩል */
        .received { align-self: flex-start; background-color: #e4e6eb; } /* የተቀበለው በግራ በኩል */
        
        #input-area { display: flex; padding: 10px; background: #f0f2f5; align-items: center; box-sizing: border-box; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; margin-right: 5px; min-width: 0; }
        
        /* የስም መጻፊያውን ሳጥን መጠን ለመቀነስ */
        #userInput { width: 60px; max-width: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; margin-right: 5px; text-align: center; }
        
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 1rem; flex-shrink: 0; }
        button:hover { background-color: #0056b3; }
        #emoji-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; margin-right: 5px; padding: 0; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="messages">
            <div class="message received">ሰላም! እንዴት ነህ?</div>
            <div class="message sent">ሰላም! እኔ ደህና ነኝ። ያንተስ?</div>
        </div>
        <div id="input-area">
            <button id="emoji-btn">😊</button>
            <input type="text" id="messageInput" placeholder="መልዕክት ይጻፉ...">
            <input type="text" id="userInput" placeholder="ስምህ (Guest)">
            <button id="sendBtn">ላክ</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const emojiBtn = document.getElementById('emoji-btn');

        // መልዕክት ለመላክ
        function sendMessage() {
            const text = messageInput.value;
            const user = userInput.value || 'Guest';

            if (text.trim() !== "") {
                // መልዕክቱን በዌብሳይቱ ላይ አሳይ
                const messageHtml = <div class="message sent"><b>${user}:</b> ${text}</div>;
                messagesDiv.innerHTML += messageHtml;
                messageInput.value = ""; // የመጻፊያውን ቦታ አጽዳ
                messagesDiv.scrollTop = messagesDiv.scrollHeight; // ወደ ታች ውረድ
            }
        }

        // 'ላክ' ቁልፍ ሲጫን
        sendBtn.addEventListener('click', sendMessage);

        // 'Enter' ቁልፍ ሲጫን መልዕክት ላክ
        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // ኢሞጂ ለመጨመር
        emojiBtn.addEventListener('click', () => {
            messageInput.value += "😊";
            messageInput.focus();
        });
    </script>
</body>
</html>
